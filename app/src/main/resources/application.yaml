spring:
  application:
    name: agent-app
  ai:
    deepseek:
      # 密钥只从环境变量 DEEPSEEK_API_KEY 读取，不要写进文件；占位值只保证没有密钥时服务也能启动、先体验插件管理接口。
      api-key: ${DEEPSEEK_API_KEY:sk-*******}
      # 默认是火山方舟上的 DeepSeek（OpenAI 兼容接口）；使用 DeepSeek 官方 API 时改为 https://api.deepseek.com 和 deepseek-chat。
      base-url: ${DEEPSEEK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash-ga-260731}
    tools:
      confirmation:
        # Spring AI 官方的工具确认名单：调用这些工具前先暂停，等人批准。Bash 直接在宿主机上执行命令，所以每次都要批准。
        # 它和工具自身的 @Tool(requiresConfirmation = true)、插件的审批规则（一个 ToolCallConfirmationPolicy bean）按 or 组合，
        # 只会增加需要审批的调用。只在可信的本地环境里体验时，才把 Bash 从这里删掉。
        tools:
          - Bash
  servlet:
    multipart:
      # Spring Boot 默认只允许 1MB 的上传；插件 JAR 的上限由下面的 plugins.max-jar-size 决定。
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

plugins:
  # registry.json、各版本 JAR、插件数据目录和上传暂存区都放在这里（相对启动目录）。
  root: ${PLUGINS_ROOT:data/plugins}
  max-jar-size: 50MB
  # 退役的旧版本最多等待这么久，让已经开始的对话用完它；应长于一次对话的最长耗时。
  retire-timeout: 5m

chat:
  # Bash 工具执行命令时的工作目录。
  workspace: ${CHAT_WORKSPACE:data/workspace}
  # 需要审批的工具调用最多等待多久；超时按“不批准”处理。
  approval-timeout: 2m
  # SSE 心跳间隔：等待审批时，服务端靠心跳写入失败来发现客户端已经断开，然后撤回审批、释放插件租约。
  heartbeat-interval: 15s

logging:
  level:
    com.example.agent: INFO
